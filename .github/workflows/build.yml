name: Build_Windows_Wheel
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - name: Build
        run: |
          pip install wheel
          pip wheel lanms-neo==1.0.2
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: windows-wheel
          path: ./*.whl
